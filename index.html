<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Umbrella Graphic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="umbrella-logo.png" alt="Umbrella Corporation"><span>Graphic</span></div>
    <button id="downloadTop" class="btn primary" type="button">DOWNLOAD PNG</button>
  </header>

  <main class="workspace">
    <aside class="control-panel" aria-label="Graphic controls">
      <section class="section">
        <h2>Match image</h2>
        <div id="dropzone" class="dropzone" tabindex="0">
          <strong>DROP PHOTO HERE</strong>
          <small>JPG / PNG / WEBP</small>
          <button id="chooseImage" type="button" class="btn secondary">SELECT IMAGE</button>
          <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        </div>
        <div id="fileName" class="file-name">No image selected</div>
      </section>

      <section class="section">
        <h2>Match information</h2>
        <div class="team-grid">
          <label>TEAM 1<input id="team1" type="text" value="TEAM 1" maxlength="22"></label>
          <label>TEAM 2<input id="team2" type="text" value="TEAM 2" maxlength="22"></label>
          <label>SCORE<input id="score1" type="number" min="0" max="99" value="0"></label>
          <label>SCORE<input id="score2" type="number" min="0" max="99" value="0"></label>
        </div>
      </section>

      <section class="section">
        <div class="title-row"><h2>Scorers</h2><span id="scorerCount">3</span></div>
        <div id="scorers" class="scorers"></div>
        <button id="addScorer" type="button" class="btn secondary full">+ ADD SCORER</button>
      </section>

      <section class="section">
        <h2>Image position</h2>
        <label>ZOOM <output id="zoomValue">100%</output><input id="zoom" type="range" min="100" max="180" value="100"></label>
        <label>HORIZONTAL <output id="xValue">50%</output><input id="posX" type="range" min="0" max="100" value="50"></label>
        <label>VERTICAL <output id="yValue">50%</output><input id="posY" type="range" min="0" max="100" value="50"></label>
        <button id="resetPosition" type="button" class="btn ghost full">RESET IMAGE</button>
      </section>

      <section class="section">
        <h2>Graphic position</h2>
        <label>INFO BOX UP / DOWN <output id="panelYValue">50%</output><input id="panelY" type="range" min="25" max="75" value="50"></label>
        <label>LOGO SIZE <output id="logoSizeValue">100%</output><input id="logoSize" type="range" min="55" max="150" value="100"></label>
      </section>

      <section class="actions">
        <button id="download" type="button" class="btn primary large">DOWNLOAD GRAPHIC</button>
        <button id="resetAll" type="button" class="btn ghost">RESET ALL</button>
      </section>
    </aside>

    <section class="preview-area">
      <div class="preview-head"><strong>LIVE PREVIEW</strong><span>1080 × 1920</span></div>
      <div class="canvas-shell"><canvas id="preview" width="1080" height="1920"></canvas></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
